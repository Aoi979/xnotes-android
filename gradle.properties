# Bound both command-line and Android Studio builds on memory-constrained hosts.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 migration is deferred; keep the existing Kotlin Gradle plugin and DSL for now.
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
